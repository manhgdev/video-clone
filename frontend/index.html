<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/zm-logo.png" />
    <link rel="preload" href="/fonts/NotoSans-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <title>VideoClone ZM — Studio Dịch Thuật & Lồng Tiếng AI</title>
    <!-- Anti-FOUC: apply saved theme before first paint, default = light -->
    <script>
      (function(){try{var t=localStorage.getItem('videoclone.theme');if(t==='dark')document.documentElement.classList.add('dark');}catch(e){}})();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
