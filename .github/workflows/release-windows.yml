name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        shell: pwsh
        run: |
          npm ci
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install --upgrade pip
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements-app.txt pyinstaller pywebview uv pythonnet
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
            'C:\ProgramData\chocolatey\bin' | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build EXE
        shell: pwsh
        run: npm run build:app

      - name: Create release package
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem build_app/release -Directory -Filter 'VideoClone_v*' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $package) { throw 'Không tìm thấy thư mục bản build.' }
          $exe = Join-Path $package.FullName 'VideoClone.exe'
          if (-not (Test-Path $exe)) { throw "Không tìm thấy EXE: $exe" }
          $zip = Join-Path (Split-Path $package.FullName) "$($package.Name)-windows-x64.zip"
          Compress-Archive -Path "$($package.FullName)\*" -DestinationPath $zip -CompressionLevel Optimal
          "directory=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-windows-x64
          path: |
            ${{ steps.package.outputs.exe }}
            ${{ steps.package.outputs.zip }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          EXE: ${{ steps.package.outputs.exe }}
          ZIP: ${{ steps.package.outputs.zip }}
        shell: pwsh
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:EXE $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:EXE $env:ZIP --generate-notes --title "VideoClone $env:TAG"
          }
